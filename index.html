<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f5f5" />
  <title>Driver Taxi Accounting</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;background:#f5f5f5;color:#111827;
      font-family:Arial,Helvetica,sans-serif;
    }
    .app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:30px}
    .topbar{
      height:82px;display:flex;align-items:center;justify-content:space-between;
      padding:0 22px;background:#f5f5f5;position:sticky;top:0;z-index:10;
    }
    .icon-btn{border:0;background:transparent;font-size:31px;cursor:pointer;line-height:1}
    .brand{font-size:34px;font-weight:900;letter-spacing:-2px}
    .bell{font-size:30px}
    main{padding:0 22px}
    .hello{font-size:39px;font-weight:700;margin:24px 0 58px;letter-spacing:-1.5px}
    .section-title{font-size:22px;font-weight:700;color:#737783;margin:0 0 18px}
    .notice{
      border:2px solid #d62970;border-radius:27px;background:#fff;
      padding:17px 18px;display:flex;align-items:center;gap:14px;margin-bottom:48px;
    }
    .notice-icon{
      width:54px;height:54px;border-radius:50%;background:#f0f1f6;
      display:grid;place-items:center;font-size:27px;
    }
    .notice-text{font-size:17px;font-weight:700;flex:1}
    .badge{background:#ec1268;color:white;padding:12px 13px;border-radius:11px;font-weight:800}
    .card{
      background:#fff;border-radius:28px;padding:25px 22px;
      box-shadow:0 1px 1px rgba(0,0,0,.02);margin-bottom:34px;
    }
    .period{font-size:16px;color:#70747e;margin-bottom:20px}
    .total-row{display:flex;justify-content:space-between;align-items:center}
    .total{font-size:42px;font-weight:800;letter-spacing:-1.5px}
    .currency{font-size:20px;font-weight:700}
    .money-icon{
      width:75px;height:75px;border-radius:50%;background:#0d1033;color:#fff;
      display:grid;place-items:center;font-size:32px;
    }
    .chart{height:250px;display:flex;align-items:flex-end;gap:9px;padding:18px 0 5px;border-bottom:2px solid #171717}
    .bar{flex:1;background:#cfd5f5;border-radius:7px 7px 0 0;min-width:10px}
    .days{display:flex;gap:9px;font-size:11px;color:#555;justify-content:space-between;padding-top:8px}
    .avg{margin-top:42px;border-left:6px solid #ed166a;padding-left:14px}
    .avg-label{font-size:15px;margin-bottom:8px}
    .avg-value{font-size:32px;font-weight:800}
    .quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:34px}
    .quick{
      background:#fff;border:0;border-radius:20px;padding:17px 8px;
      font-weight:700;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)
    }
    .quick span{display:block;font-size:27px;margin-bottom:9px}
    .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .summary{
      background:#fff;border-radius:20px;padding:18px
    }
    .summary small{display:block;color:#737783;margin-bottom:8px}
    .summary strong{font-size:25px}
    .drawer{
      position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20
    }
    .drawer.open{display:block}
    .menu{
      width:82%;max-width:360px;height:100%;background:#fff;padding:30px 22px;
      border-radius:0 28px 28px 0
    }
    .menu h2{margin:0 0 28px;font-size:27px}
    .menu button{
      width:100%;text-align:left;border:0;background:transparent;padding:16px 8px;
      font-size:18px;border-radius:12px;cursor:pointer
    }
    .menu button:hover{background:#f1f2f5}
    @media(max-width:390px){
      .hello{font-size:34px}.total{font-size:35px}.brand{font-size:30px}
      main{padding:0 16px}.topbar{padding:0 16px}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="icon-btn" onclick="toggleMenu()">☰</button>
    <div class="brand">Driver's</div>
    <button class="icon-btn bell">♧</button>
  </header>

  <main>
    <h1 class="hello">Hey, Driver!</h1>

    <h2 class="section-title">Highlights</h2>
    <div class="notice">
      <div class="notice-icon">▣</div>
      <div class="notice-text">Accounting notifications</div>
      <div class="badge">0 ›</div>
    </div>

    <h2 class="section-title">My Collections</h2>
    <section class="card">
      <div class="period">Collections - Current Cycle</div>
      <div class="total-row">
        <div><span class="total" id="totalAmount">0.00</span> <span class="currency">AED</span></div>
        <div class="money-icon">▣</div>
      </div>

      <div class="chart" aria-label="Collection chart">
        <div class="bar" style="height:35%"></div>
        <div class="bar" style="height:55%"></div>
        <div class="bar" style="height:70%"></div>
        <div class="bar" style="height:62%"></div>
        <div class="bar" style="height:48%"></div>
        <div class="bar" style="height:65%"></div>
        <div class="bar" style="height:42%"></div>
        <div class="bar" style="height:28%"></div>
      </div>
      <div class="days"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span><span>Today</span></div>

      <div class="avg">
        <div class="avg-label">Daily Avg</div>
        <div class="avg-value" id="avgAmount">0.00 AED</div>
      </div>
    </section>

    <h2 class="section-title">Quick Actions</h2>
    <div class="quick-grid">
      <button class="quick" onclick="alert('New Invoice screen will be connected next.')"><span>＋</span>New Invoice</button>
      <button class="quick" onclick="alert('Calculator will be connected next.')"><span>🧮</span>Calculator</button>
      <button class="quick" onclick="alert('Target Setup will be connected next.')"><span>🎯</span>Target Setup</button>
    </div>

    <h2 class="section-title">My Summary</h2>
    <div class="summary-grid">
      <div class="summary"><small>Target</small><strong>0%</strong></div>
      <div class="summary"><small>Target Amount</small><strong>0 AED</strong></div>
      <div class="summary"><small>Deductions</small><strong>0 AED</strong></div>
      <div class="summary"><small>Net Amount</small><strong>0 AED</strong></div>
    </div>
  </main>
</div>

<div class="drawer" id="drawer" onclick="toggleMenu()">
  <nav class="menu" onclick="event.stopPropagation()">
    <h2>Driver Accounting</h2>
    <button>🏠 Dashboard</button>
    <button>🧾 New Invoice</button>
    <button>🧮 Calculator / Charges</button>
    <button>🎯 Target Setup</button>
    <button>📋 Invoice History</button>
    <button>📊 Reports</button>
    <button>👤 Profile</button>
    <button>↪ Logout</button>
  </nav>
</div>

<script>
  function toggleMenu(){
    document.getElementById('drawer').classList.toggle('open');
  }
</script>
</body>
</html>
